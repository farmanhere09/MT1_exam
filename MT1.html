<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multimedia Player</title>
</head>
<body>
    <h1>Multimedia Player</h1>
    
    <h2> Audio section</h2>
    <audio controls>
        <source src="web page audio.mp3" type="audio/mpeg">

    <h2>video section</h2>
    <video width="320" height="180" controls>
        <source src="web page video.mp4" type="video/mp4"> </video>
</body>
</html>
